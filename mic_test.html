<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceZoo Platform Spike</title>
<style>
 body { font-family: system-ui, sans-serif; margin: 16px; max-width: 560px; }
 button { font-size: 18px; padding: 12px 20px; margin: 6px 4px 6px 0; }
 .ok { color: #0a7d34; }
 .fail { color: #c0392b; font-weight: bold; }
 #log { white-space: pre-wrap; background: #f4f4f4; padding: 10px; font-size: 13px; border-radius: 6px; margin-top: 8px; }
 canvas { border: 1px solid #ccc; background: #fafafa; }
</style>
</head>
<body>
<h2>VoiceZoo Platform Spike</h2>
<p>Validates the Phase 2 / Sprint 16 primitives: mic capture to WAV, playback, selfie oval-crop. Throwaway file - delete before the real deploy.</p>

<h3>1. Microphone to WAV (3s)</h3>
<button id="recBtn">Record 3 seconds</button>
<button id="playBtn" disabled>Play recording</button>

<h3>2. Selfie to oval crop (128x128)</h3>
<input type="file" id="selfie" accept="image/*" capture="user">
<div style="margin-top:8px"><canvas id="cropCanvas" width="128" height="128"></canvas></div>

<h3>Report</h3>
<div id="log"></div>

<script>
(function(){
 var logEl = document.getElementById('log');
 function log(msg, cls){
   var line = document.createElement('div');
   if (cls) line.className = cls;
   line.textContent = msg;
   logEl.appendChild(line);
 }

 log('userAgent: ' + navigator.userAgent);
 var hasGUM = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
 log('getUserMedia: ' + (hasGUM ? 'available' : 'MISSING'), hasGUM ? 'ok' : 'fail');
 if (window.MediaRecorder) {
   var types = ['audio/webm', 'audio/webm;codecs=opus', 'audio/mp4', 'audio/wav'];
   var supported = types.filter(function(t){ return MediaRecorder.isTypeSupported(t); });
   log('MediaRecorder types: ' + (supported.join(', ') || 'none'));
 } else {
   log('MediaRecorder: missing (informational - WAV path does not need it)');
 }

 var wavBlob = null;
 var audioCtx = null;

 document.getElementById('recBtn').onclick = function(){
   var btn = this;
   if (!hasGUM) { log('cannot record: getUserMedia missing', 'fail'); return; }
   btn.disabled = true;
   navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
     log('mic permission: granted', 'ok');
     audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
     if (audioCtx.state === 'suspended') { audioCtx.resume(); }
     var sampleRate = audioCtx.sampleRate;
     log('AudioContext sampleRate: ' + sampleRate);
     var source = audioCtx.createMediaStreamSource(stream);
     var proc = audioCtx.createScriptProcessor(4096, 1, 1);
     var chunks = [];
     proc.onaudioprocess = function(e){
       chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
     };
     // mute node prevents mic-to-speaker feedback while keeping the graph running
     var mute = audioCtx.createGain();
     mute.gain.value = 0;
     source.connect(proc);
     proc.connect(mute);
     mute.connect(audioCtx.destination);
     setTimeout(function(){
       proc.disconnect(); source.disconnect(); mute.disconnect();
       stream.getTracks().forEach(function(t){ t.stop(); });
       var total = 0;
       for (var i = 0; i < chunks.length; i++) total += chunks[i].length;
       log('captured: ' + total + ' samples (' + (total / sampleRate).toFixed(2) + 's)', total > 0 ? 'ok' : 'fail');
       wavBlob = encodeWav(chunks, total, sampleRate);
       log('WAV size (mono 16-bit): ' + (wavBlob.size / 1024).toFixed(0) + ' KB for 3s');
       log('projected: ' + (wavBlob.size / 3 * 10 / 1024).toFixed(0) + ' KB per 10s clip, ' +
           (wavBlob.size / 3 * 10 * 4 / 3 / 1024).toFixed(0) + ' KB as base64');
       document.getElementById('playBtn').disabled = false;
       btn.disabled = false;
       btn.textContent = 'Record again';
     }, 3000);
   }).catch(function(err){
     log('mic permission FAILED: ' + err.name + ' - ' + err.message, 'fail');
     btn.disabled = false;
   });
 };

 document.getElementById('playBtn').onclick = function(){
   if (!wavBlob) return;
   var a = new Audio(URL.createObjectURL(wavBlob));
   var p = a.play();
   if (p && p.then) {
     p.then(function(){ log('playback: started', 'ok'); })
      .catch(function(e){ log('playback FAILED: ' + e.message, 'fail'); });
   }
 };

 function encodeWav(chunks, totalLen, sampleRate){
   var buffer = new ArrayBuffer(44 + totalLen * 2);
   var view = new DataView(buffer);
   function ws(o, s){ for (var i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); }
   ws(0, 'RIFF'); view.setUint32(4, 36 + totalLen * 2, true); ws(8, 'WAVE');
   ws(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
   view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
   view.setUint16(32, 2, true); view.setUint16(34, 16, true);
   ws(36, 'data'); view.setUint32(40, totalLen * 2, true);
   var off = 44;
   for (var c = 0; c < chunks.length; c++) {
     var ch = chunks[c];
     for (var i = 0; i < ch.length; i++) {
       var s = Math.max(-1, Math.min(1, ch[i]));
       view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
       off += 2;
     }
   }
   return new Blob([buffer], { type: 'audio/wav' });
 }

 document.getElementById('selfie').onchange = function(){
   var file = this.files[0];
   if (!file) return;
   log('selfie file: ' + (file.type || 'unknown type') + ', ' + (file.size / 1024).toFixed(0) + ' KB');
   var img = new Image();
   img.onload = function(){
     var t0 = performance.now();
     var canvas = document.getElementById('cropCanvas');
     var ctx = canvas.getContext('2d');
     ctx.clearRect(0, 0, 128, 128);
     ctx.save();
     ctx.beginPath();
     ctx.ellipse(64, 64, 52, 64, 0, 0, Math.PI * 2);
     ctx.clip();
     var side = Math.min(img.width, img.height);
     var sx = (img.width - side) / 2;
     var sy = (img.height - side) / 2;
     ctx.drawImage(img, sx, sy, side, side, 0, 0, 128, 128);
     ctx.restore();
     var ms = performance.now() - t0;
     log('oval crop 128x128: ' + ms.toFixed(1) + ' ms (target < 50ms)', ms < 50 ? 'ok' : 'fail');
     log('source: ' + img.width + 'x' + img.height);
     URL.revokeObjectURL(img.src);
   };
   img.onerror = function(){ log('image decode FAILED (HEIC without conversion?)', 'fail'); };
   img.src = URL.createObjectURL(file);
 };
})();
</script>
</body>
</html>
